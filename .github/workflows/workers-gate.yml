# WS2 workers live gate — the Supabase-ONLY workers-topology acceptance lane.
#
# Regenerates the 10-domain fixture (crates/codegraph/tests/fixtures/
# workers_gate/), migrates a scratch database inside the fixture's local
# Supabase stack, builds the 11-crate workers workspace (gateway + one
# worker per domain, cornucopia), boots everything, and runs the generated
# hurl contracts through the gateway — asserting the genuine 200/201 +
# 409 + 501 status mix.
#
# NOTE: the FIRST run pulls multiple GB of Supabase docker images and cold-
# builds the driver + worker crates; expect the better part of an hour.
# Warm runs are dramatically shorter.
#
# No secrets needed: the fixture manifest uses the standard local demo
# keys (codegraph-ops falls back to the same constants).
#
# PR CI stays node-free/DB-free — this runs on workflow_dispatch and the
# nightly cron only (the ifml-gate.yml precedent).

name: Workers Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  workers-gate:
    # Pinned off the rolling tag: `ubuntu-latest` is moving to 26.04
    # (resolute), whose archive does not ship the `libxml2` the hurl .deb
    # depends on ("not installable") — the reason ci.yml's
    # `test-ops-integration` job runs on 24.04 (noble). The exit-127 defect
    # observed here was the tarball's `bin/` nesting (see the hurl step), so
    # the .deb is the load-bearing fix and this pin keeps the lane off a tag
    # mid-rollout. Nothing else here is runner-specific.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # psql for the scratch-database lifecycle (the suite's own stages).
      - name: Install postgresql-client
        run: scripts/ci/apt-install.sh --if-missing psql postgresql-client
      # The .deb recipe from ci.yml's `test-ops-integration` job (proven
      # there): the release TARBALL nests its binaries under
      # `hurl-<ver>-x86_64-unknown-linux-gnu/bin/`, so the old
      # `tar --strip-components=1 -C /usr/local/bin` installed
      # /usr/local/bin/bin/hurl — off PATH, `hurl: command not found`.
      - name: Install hurl
        run: |
          HURL_VERSION=8.1.0
          curl --silent --location --remote-name \
            "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl_${HURL_VERSION}_amd64.deb"
          scripts/ci/apt-install.sh "./hurl_${HURL_VERSION}_amd64.deb"
          hurl --version
      # Pre-pull the PINNED CLI (and warm the npm cache) before the gate
      # runs. This must stay the ONLY `npx … supabase` command in the file,
      # and its version literal MUST equal `SUPABASE_CLI_VERSION` in
      # crates/codegraph/tests/workers_live_gate.rs — that suite's node-free
      # lockstep pin fails, naming the mismatch, otherwise (issue #729: a
      # bare `npx supabase` resolves npm `latest`, and the pinned CLI rejects
      # the fixture's legacy config key).
      - name: Prefetch Supabase CLI
        run: npx --yes supabase@3.2.0 --version
      - name: Run workers live gate
        run: cargo test -p codegraph --test workers_live_gate -- --ignored --nocapture
      - name: Upload gate logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: workers-gate-logs
          if-no-files-found: ignore
          path: |
            /tmp/codegraph-ops-worker-*.log
            /tmp/codegraph-ops-gateway.log
            /tmp/codegraph-ops-workers-build.log
            /tmp/workers-gate-suite.log
            /tmp/workers-gate-results.json
            crates/codegraph/tests/fixtures/workers_gate/test-results/
