name: CI

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::too_many_lines

  test:
    runs-on: ubuntu-latest
    env:
      # Debug info dominates the target dir for a full-workspace test
      # build; CI doesn't consume backtraces. Halves disk usage and keeps
      # lld under the runner's disk ceiling (SIGBUS-on-link when ENOSPC).
      RUSTFLAGS: -C debuginfo=0
    steps:
      - uses: actions/checkout@v7
      # ubuntu-latest ships ~25 GB of preinstalled tooling the build never
      # touches. `cargo test --workspace` on this workspace produces tens
      # of GB under target/, and an ENOSPC mid-link surfaces as
      # `collect2: fatal error: ld terminated with signal 7 [Bus error]`.
      # Swap is kept: rustc/lld OOM without it shows up as SIGKILL instead.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The mox-plane compile pin (issue #517) cargo-checks the emitted
          # plane on wasm32-unknown-unknown as well as native.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  test-ops-integration:
    # Pinned: ubuntu-latest moved to 26.04 (resolute), whose archive no
    # longer ships the `libxml2` the hurl .deb depends on ("not installable").
    # 24.04 (noble) installs it cleanly; everything else in this job is
    # runner-agnostic (supabase-postgres service, dtolnay toolchain,
    # rust-cache).
    runs-on: ubuntu-24.04
    # Issue #708: the job exists to exercise the full generated platform
    # band (basejump + pgmq + extensions), so the service must BE the
    # Supabase postgres image — the same image ifml-gate.yml /
    # entity-gate.yml / test_framework/postgres.rs run. A vanilla
    # postgres:<n> made the two band tests skip themselves and the job
    # stayed green while the band was never applied.
    #
    # POSTGRES_USER must be supabase_admin: the image's
    # /docker-entrypoint-initdb.d/migrate.sh runs `psql -U supabase_admin`
    # BEFORE that role exists, so the bootstrap only completes when
    # supabase_admin is the init user (with POSTGRES_USER=postgres the
    # container exits 2 — the IFML/entity gates' comments carry the full
    # story). The tests still connect as `postgres` (DATABASE_URL
    # unchanged): the image creates that role too.
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:17.6.1.132
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: supabase_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Issue #708: fail closed in this lane — a missing Supabase
      # capability FAILS naming the image instead of silently skipping the
      # band tests. Local plain-Postgres runs keep today's skip behaviour
      # (the env stays unset there).
      CODEGRAPH_REQUIRE_SUPABASE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The worker wasm gate (issue #550) cargo-checks the generated
          # worker plane on wasm32-unknown-unknown against a stubbed
          # cornucopia-queries — no DB needed.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run ops DB integration tests
        run: cargo test -p codegraph-ops --test db_integration -- --ignored --nocapture
      - name: Run ops generator tests
        run: cargo test -p codegraph --test ops_generator_tests -- --ignored --nocapture
      - name: Wrapper compile gate (issue #348)
        run: cargo test -p codegraph --test wrapper_compile_tests -- --ignored --nocapture
      - name: Service-ops compile gate (#551 policy, incl. the depth-2 grandchild surface — issue #629, and the design-invariant plane — issue #666)
        run: cargo test -p codegraph --test service_ops_compile_gate -- --ignored --nocapture
      - name: Injected-scope when compile gate (issue #663 — own binary, see #746)
        run: cargo test -p codegraph --test service_ops_injected_guard_gate -- --ignored --nocapture
      - name: Run cornucopia hooks runtime pins (issue #518)
        run: cargo test -p codegraph --test hooks_cornucopia_runtime_tests -- --ignored --nocapture
      - name: Worker wasm gate (issue #550)
        run: cargo test -p codegraph --test worker_wasm_compile_tests -- --ignored --nocapture
      - name: Install hurl (service-ops live gates)
        run: |
          HURL_VERSION=8.1.0
          curl --silent --location --remote-name \
            "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl_${HURL_VERSION}_amd64.deb"
          sudo apt-get update && sudo apt-get install -y "./hurl_${HURL_VERSION}_amd64.deb"
          hurl --version
      - name: Service-ops hurl gate (lifecycle hardening WS1)
        run: cargo test -p codegraph --test service_ops_hurl_gate -- --ignored --nocapture
      - name: Design-invariant live gate (issue #666 slices 4d+4e)
        run: cargo test -p codegraph --test ddd_invariants_live_gate -- --ignored --nocapture
