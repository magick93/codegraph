name: IFML Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  ifml-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        # The Supabase postgres image: the generated stack relies on the
        # `auth` schema (BaseJump sessions, auth.uid() RLS) which only this
        # image ships.
        image: public.ecr.aws/supabase/postgres:17.6.1.132
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright chromium
        run: npx --yes playwright@1.62.0 install --with-deps chromium
      - name: Run IFML codegen gate
        run: cargo test -p codegraph --test ifml_codegen_gate -- --ignored --nocapture
      # Issue #700: child-table tenancy at the DB tier. It generates its own
      # migration set with the current generators (never a committed fixture —
      # that is how the defect survived review), so it runs here, where the
      # service is the supported Supabase image, rather than in the ops lane's
      # plain postgres service (#708 moves that lane onto this image).
      - name: Child-table tenancy gate (#700)
        run: cargo test -p codegraph --test child_tenant_contract_tests -- --ignored --nocapture
      # Issue #695 Stage 1: the media plane's behavioural gate. It boots
      # RustFS (a real S3-compatible server) in docker and drives upload /
      # display / overwrite / remove plus the cross-tenant denials against a
      # generated + booted axum app, so it belongs here (Supabase image, no
      # PR cost) rather than in the ops lane: the whole generated app is
      # compiled from scratch (~10 min) and the ops lane's service is plain
      # postgres (#708 moves it to this image).
      - name: Pull RustFS (media runtime gate's S3 store)
        run: docker pull rustfs/rustfs:latest
      - name: Media runtime gate (#695 Stage 1 — RustFS)
        run: cargo test -p codegraph --test media_runtime_tests -- --ignored --nocapture
      - name: Upload gate logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ifml-gate-logs
          path: |
            target/ifml-gate/logs/
            /tmp/opencode/ws695-media-runtime/logs/
          if-no-files-found: ignore
