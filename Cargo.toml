[workspace]
resolver = "2"
members = [
    "crates/codegraph",
    "crates/codegraph-generate",
    "crates/codegraph-core",
    "crates/codegraph-classifier",
    "crates/codegraph-config",
    "crates/codegraph-ext-points",
    "crates/codegraph-grafeo",
    "crates/codegraph-backend",
    "crates/codegraph-naming",
    "crates/codegraph-type-contracts",
    "crates/codegraph-workflow",
    "crates/ast-ifml",
    "gravy-atproto",
    "crates/codegraph-ops",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "2"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rust_decimal = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
tera = { version = "2", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
codegraph-config = { path = "crates/codegraph-config" }
heck = "0.5"
base64 = "0.22"
garde = "0.20"
utoipa = { version = "6", features = ["uuid", "chrono"] }
sea-orm = { version = "2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
axum = "0.8"
bytes = "1"
lsp-types = "0.97"
# tree-sitter cannot move past 0.25 until auto-lsp releases > 0.6.2: the
# crate uses `links = "tree-sitter"`, so two versions cannot coexist, and
# auto-lsp 0.6.2 (newest) requires ^0.25.5 and re-exports it through
# `auto_lsp::tree_sitter` (issue #422). auto-lsp master is on 0.26.5 but
# unreleased — coordinate the jump with its next release.
tree-sitter = "0.25"
tree-sitter-language = "0.1"
# salsa: no direct dependency anywhere — 0.22 rides in transitively via
# auto-lsp 0.6.2 (0.23 via rex-driver). A direct salsa upgrade is gated on
# the same auto-lsp release as tree-sitter above (issue #423).
# rex-* @ 1fe0ca9: rexlang PR #174 dedup sweep (12 issues) — internal
# refactor only (shared Import type replaces the ImportDecl/UcImport/
# CmmnImport triplicate, rex-strings/rex-dates zero-dep leaf crates,
# VersionedArtifact default methods + default_format_version!, centralized
# format-version markers, did_you_mean hoisted to rex-diagnostics). Zero
# codegraph fallout — full scan found no references to any swept surface,
# all rex wire FORMAT_VERSIONs stay 1, conformance fixtures untouched, so
# the committed ddd/evt goldens byte-match. Sigil pin UNCHANGED (upstream
# still pins 69115a7 — lockstep is a no-op). Historical context of the
# previous pin follows.
# rex-* @ 194056b: bumped past the union integrity pass (rexlang #114's
# merge — rex_driver::check_integrity, the cross-layer doctor stage below)
# for the declaration-backed control/route manifest (rexlang #118 —
# rex_ifml::manifest_ifml / rex_ir::ifml_manifest), the workspace-level
# cross-surface resolution (#117 — E0104–E0108: action/navigate/refresh
# references resolve against declarations; requires:/roles: resolve
# against .actor models via check_ifml_with_actors), the .deploy
# deployment surface (#49), the DDD Sculptor semantics (#47), and the
# IFML module composition + deep-navigation grammar (#45/#46) — plus the
# new-in-this-bump surfaces: typed lifecycles (Rule 16, bare-String
# status fields are design errors), service-op emits/invokes +
# decision_dependencies, the .evt delivery model (CloudEvents attrs,
# DeliveryPolicy, channel scope, subscription when), .deploy port/health/
# cors settings + env blocks, the .dmn decision-model surface (rexlang
# #78, dsntk-backed), the IFML lint channel (W0150–W0199 — WARNING
# severity; codegraph's front door hard-fails on Error only), the
# central diagnostics registry + capability joins (rexlang #128), and
# the Rune-body statement IR (rex_expr::ExprKind::RuneBody — refused by
# codegraph's closed-subset lowerers). NOTE the bump also drags in new
# transitive git deps (rex-diagnostics in-repo; xstate-ir from
# restingstate.git; dsntk-recognizer/feel from the yestechgroup dsntk-rs
# fork — all anonymously fetchable).
rex-ir = { git = "https://github.com/yestechgroup/rexlang.git", rev = "1fe0ca90006613dfc9bd8ee6c7feee0241f2b4cf" }
rex-driver = { git = "https://github.com/yestechgroup/rexlang.git", rev = "1fe0ca90006613dfc9bd8ee6c7feee0241f2b4cf" }
rex-expr = { git = "https://github.com/yestechgroup/rexlang.git", rev = "1fe0ca90006613dfc9bd8ee6c7feee0241f2b4cf" }
rex-ifml = { git = "https://github.com/yestechgroup/rexlang.git", rev = "1fe0ca90006613dfc9bd8ee6c7feee0241f2b4cf" }
# Sigil (Rune DSL / .rosetta) — issue #255. Pinned by rev like the rexlang
# crates; depended on from `crates/codegraph` ONLY (no sigil deps may leak
# into codegraph-generate / codegraph-core). Pinned to the SAME rev rexlang
# itself pins (69115a7) so exactly ONE sigil version exists in the tree —
# move only in lockstep with rexlang's pin.
sigil-model = { git = "https://github.com/yestechgroup/sigil.git", rev = "69115a79999e6ff2ce04c039a71edac6d8ba2468" }
sigil-resolve = { git = "https://github.com/yestechgroup/sigil.git", rev = "69115a79999e6ff2ce04c039a71edac6d8ba2468" }
sigil-syntax = { git = "https://github.com/yestechgroup/sigil.git", rev = "69115a79999e6ff2ce04c039a71edac6d8ba2468" }
sigil-diag = { git = "https://github.com/yestechgroup/sigil.git", rev = "69115a79999e6ff2ce04c039a71edac6d8ba2468" }

# Performance profiling profile (issues #469/#471): release optimizations with
# symbols intact so samply / hotpath-cpu can attribute samples. Build with
# `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
