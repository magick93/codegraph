[workspace]
resolver = "2"
members = [
    "crates/codegraph",
    "crates/codegraph-generate",
    "crates/codegraph-core",
    "crates/codegraph-classifier",
    "crates/codegraph-config",
    "crates/codegraph-ext-points",
    "crates/codegraph-grafeo",
    "crates/codegraph-backend",
    "crates/codegraph-naming",
    "crates/codegraph-type-contracts",
    "crates/codegraph-workflow",
    "crates/ast-ifml",
    "gravy-atproto",
    "crates/codegraph-ops",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "2"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rust_decimal = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
tera = { version = "2", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
codegraph-config = { path = "crates/codegraph-config" }
heck = "0.5"
base64 = "0.22"
garde = "0.20"
utoipa = { version = "6", features = ["uuid", "chrono"] }
sea-orm = { version = "2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
axum = "0.8"
bytes = "1"
lsp-types = "0.97"
# tree-sitter cannot move past 0.25 until auto-lsp releases > 0.6.2: the
# crate uses `links = "tree-sitter"`, so two versions cannot coexist, and
# auto-lsp 0.6.2 (newest) requires ^0.25.5 and re-exports it through
# `auto_lsp::tree_sitter` (issue #422). auto-lsp master is on 0.26.5 but
# unreleased — coordinate the jump with its next release.
tree-sitter = "0.25"
tree-sitter-language = "0.1"
# salsa: no direct dependency anywhere — 0.22 rides in transitively via
# auto-lsp 0.6.2, and phero-driver brings 0.28.5 (which clears
# RUSTSEC-2026-0308). A direct upgrade is still gated on the same auto-lsp
# release as tree-sitter above (issue #423).
# phero-* @ 298267e: pherolang is now **Phero Lang**. Every crate is
# `phero-*`, the repository is yestechgroup/pherolang, the binary and LSP
# identity are `pherolang`, and the artifacts carry `pheroVersion` with
# `formatVersion` 2 — the one deliberate pre-1.0 wire break (0.2 artifacts
# are REJECTED, no dual-accept window). We compile in-process and persist
# our own graph mirrors, so the break lands on the two committed golden
# fixtures and the graph-format bump (GRAPH_FORMAT_VERSION 4 → 5), never on
# generated output.
# What the bump buys (see docs/pherolang-upgrade.md):
#   * DDD epic DD1–DD9 — resolved identities/provenance, strict value
#     semantics, DTO boundaries (`DddTypeRef`, `Design.class` now
#     `Option<String>` for standalone DTOs), authored aggregate boundaries,
#     invariants, collection sets, declared error vocabulary + `throws`,
#     multi-file design applications, and typed repository queries
#     (`RepositoryOperation.query`).
#   * `.mox` — `T[] { set }` (`Feature.collection`), `class X table "…"`
#     (`ClassDef.table_name`), `register` classes (`ClassKind`), session-kind
#     grants (`SessionKind`), and the public word tables
#     (`phero_syntax::words`) our `migrate` list duplicates.
#   * `.ifml` re-platformed Pest → logos + chumsky: artifacts byte-identical,
#     the `IfmlParser`/`Rule` exports are gone, the parse/compile/check
#     entry points we use are unchanged.
#   * Every one of our upstream proposals (docs/proposals/001–006) shipped:
#     transition binding, explicit table names, executable statement bodies,
#     aggregate child operations, `condition_paths`, register classes +
#     session-kind grants.
# Dependency fallout: salsa 0.23 → 0.28.5 (clears RUSTSEC-2026-0308), tokio
# 1.54.1 (clears RUSTSEC-2026-0386), pest/pest_derive leave the graph. Sigil
# stays on 69115a7 — upstream's own pin, so lockstep is a no-op.
# Previous pin (for the history): phero-* @ 1fe0ca9 — the pherolang PR #174
# dedup sweep; artifacts carried `rexVersion` with formatVersion 1.
phero-ir = { git = "https://github.com/yestechgroup/pherolang.git", rev = "298267e32a5112dc6fd84708868b9bc59d65ade7" }
phero-driver = { git = "https://github.com/yestechgroup/pherolang.git", rev = "298267e32a5112dc6fd84708868b9bc59d65ade7" }
phero-expr = { git = "https://github.com/yestechgroup/pherolang.git", rev = "298267e32a5112dc6fd84708868b9bc59d65ade7" }
phero-ifml = { git = "https://github.com/yestechgroup/pherolang.git", rev = "298267e32a5112dc6fd84708868b9bc59d65ade7" }
# Sigil (Rune DSL / .rosetta) — issue #255. Pinned by rev like the pherolang
# crates; depended on from `crates/codegraph` ONLY (no sigil deps may leak
# into codegraph-generate / codegraph-core). Pinned to the SAME rev pherolang
# itself pins (69115a7) so exactly ONE sigil version exists in the tree —
# move only in lockstep with pherolang's pin.
sigil-model = { git = "https://github.com/yestechgroup/sigil.git", rev = "69115a79999e6ff2ce04c039a71edac6d8ba2468" }
sigil-resolve = { git = "https://github.com/yestechgroup/sigil.git", rev = "69115a79999e6ff2ce04c039a71edac6d8ba2468" }
sigil-syntax = { git = "https://github.com/yestechgroup/sigil.git", rev = "69115a79999e6ff2ce04c039a71edac6d8ba2468" }
sigil-diag = { git = "https://github.com/yestechgroup/sigil.git", rev = "69115a79999e6ff2ce04c039a71edac6d8ba2468" }

# Performance profiling profile (issues #469/#471): release optimizations with
# symbols intact so samply / hotpath-cpu can attribute samples. Build with
# `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true
