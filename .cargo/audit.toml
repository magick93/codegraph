# cargo-audit configuration (CI runs bare `cargo audit`).
[advisories]
# sqlx 0.9.0 resolves sqlx-sqlite (and its libsqlite3-sys 0.30.1) into
# Cargo.lock even though this workspace builds only the Postgres backend.
# The crate is not linked into any binary (cargo tree has no path to it);
# the advisory only clears at libsqlite3-sys >= 0.39, which sqlx 0.9.0
# pins below. Tracked with the dependency refresh (sea-orm/sqlx upgrade).
ignore = ["RUSTSEC-2026-0459"]
