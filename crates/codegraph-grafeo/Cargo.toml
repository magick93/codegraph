[package]
name = "codegraph-grafeo"
version = "0.1.0"
edition.workspace = true
description = "Grafeo graph database adapter for codegraph-core traits"

[dependencies]
codegraph-core = { path = "../codegraph-core" }
thiserror = "2"
codegraph-naming = { path = "../codegraph-naming" }
codegraph-type-contracts = { path = "../codegraph-type-contracts" }
# 0.6.0 stores WAL durability behind the opt-in `storage` feature (the 0.5.x
# defaults carried it); without it a persistent open reaches the file only at
# a checkpoint. See the Dependency policy section in AGENTS.md.
grafeo = { version = "=0.6.0", features = ["storage"] }
grafeo-core = "=0.6.0"
grafeo-common = "=0.6.0"
async-trait = "0.1"
rust_decimal = { version = "1", features = ["serde-with-str"] }
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"

[dev-dependencies]
codegraph-core = { path = "../codegraph-core", features = ["test-fixtures"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
