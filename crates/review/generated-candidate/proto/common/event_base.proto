syntax = "proto3";
package common;

import "google/protobuf/timestamp.proto";

import "shared.proto";
option go_package = "common/;common";




/// EventBase entity
message EventBase {
  
    // Unique identifier (UUID)
  string id = 1;
  
  
  optional int64 capacity = 2;
  
    // Event title
  string title = 3;
  
  
  optional google.protobuf.Timestamp birthDate = 4;
  
    // Last name
  string familyName = 5;
  
    // First name
  string givenName = 6;
  
    // Creation timestamp
  optional google.protobuf.Timestamp created_at = 998;
  
    // Last update timestamp
  optional google.protobuf.Timestamp updated_at = 999;
  
}

/// Create request for EventBase
message CreateEventBaseRequest {
  
  
  optional int64 capacity = 2;
  
    // Event title
  string title = 3;
  
  
  optional google.protobuf.Timestamp birthDate = 4;
  
    // Last name
  string familyName = 5;
  
    // First name
  string givenName = 6;
  
}

/// Update request for EventBase
message UpdateEventBaseRequest {
  
    // Unique identifier (UUID)
  string id = 1;
  
  
  optional int64 capacity = 2;
  
    // Event title
  optional string title = 3;
  
  
  optional google.protobuf.Timestamp birthDate = 4;
  
    // Last name
  optional string familyName = 5;
  
    // First name
  optional string givenName = 6;
  
}

/// Get request for EventBase
message GetEventBaseRequest {
  
    // Entity UUID
  string id = 1;
  
}

/// Delete request for EventBase
message DeleteEventBaseRequest {
  
    // Entity UUID
  string id = 1;
  
}

/// List request for EventBase
message ListEventBaseRequest {
  
    // Number of items per page
  optional int32 page_size = 1;
  
    // Pagination token
  optional string page_token = 2;
  
    // Additional field filters
  repeated FilterClause filters = 5;
  
}

/// List response for EventBase
message ListEventBaseResponse {
  
  
  repeated EventBase data = 1;
  
    // Total number of items
  int32 total = 2;
  
    // Pagination token for next page
  optional string next_page_token = 3;
  
}



// ── EventBase Service ──────────────────────────────────────────
service EventBaseService {
  
  // Create a new entity
  rpc Create(CreateEventBaseRequest) returns (EventBase);
  
  // Get an entity by ID
  rpc Get(GetEventBaseRequest) returns (EventBase);
  
  // Update an existing entity
  rpc Update(UpdateEventBaseRequest) returns (EventBase);
  
  // Delete an entity by ID
  rpc Delete(DeleteEventBaseRequest) returns (google.protobuf.Empty);
  
  // List entities with pagination
  rpc List(ListEventBaseRequest) returns (ListEventBaseResponse);
  
}
