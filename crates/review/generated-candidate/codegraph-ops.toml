# Generated by codegraph, then HAND-MAINTAINED (the `[supabase]` section + the
# fixture-owned `supabase/` project are maintained beside the regenerated
# surface — see `review_fixture_drift_tests`, which pins the generated half).
#
# The api suite runs SHAPE B (issue #709/#764): against a
# Supabase-compatible Postgres base target, with no stack spawn and no
# `[supabase]` section needed. The section below is the MANUAL full-stack
# fallback: `npx --yes supabase@3.2.0 start` inside `supabase/`, then
# `testkit api` against the pinned ports. The gate itself retargets the whole
# `[database.api]` block at its resolved base target, so both modes work.

app_name = "app"
output_dir = "."
api_version = "v1"
hooks = []
extensions = []

[smoke]
entity = "common/code"
route = "common/code"
create_body = "{}"

[servers]
api_port = 3000
ui_port = 5173
bind_addr = "0.0.0.0"

[database.api]
# The fixture-owned Supabase stack (supabase/config.toml pins db port 54350;
# the health URL below rides Kong on the api port 54351). The live gate
# retargets this WHOLE block (host/port/user/password/database) at its
# resolved base target — shape B — before invoking the suite.
host = "localhost"
port = 54350
user = "postgres"
password = "postgres"
database = "postgres"

[database.e2e]
host = "localhost"
port = 54350
user = "postgres"
password = "postgres"
database = "postgres"

