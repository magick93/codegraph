[package]
name = "codegraph-generate"
version = "0.1.0"
edition.workspace = true
description = "Codegraph code generation: 60+ generators, generator traits, template engine, and profile/BuildPlan"

[dependencies]
codegraph-core = { path = "../codegraph-core" }
codegraph-config = { path = "../codegraph-config" }
codegraph-naming = { path = "../codegraph-naming" }
codegraph-type-contracts = { path = "../codegraph-type-contracts" }
codegraph-ext-points = { path = "../codegraph-ext-points" }
rex-expr = { workspace = true }
rex-ifml = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tera = { version = "2", features = ["preserve_order"] }
heck = "0.5"
uuid = { version = "1", features = ["v4", "v5"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
pathdiff = "0.2"
walkdir = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sqlglot-rust = "=0.10.30"

[dev-dependencies]
tempfile = "3"
