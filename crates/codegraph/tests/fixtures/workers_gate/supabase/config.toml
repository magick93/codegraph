# Minimal local Supabase stack for the WS2 workers live gate.
#
# Ports 54340+ are deliberately disjoint from every other local Supabase
# stack (crewbase at 54321-54324/54327, trader-rex at 54331-54334/54337) —
# the gate must never touch those. The triple that must stay coherent:
# db port 54340 <-> [database.api].port in codegraph-ops.toml <-> the
# health_url in the same manifest (Kong auth endpoint on the api port).
# Everything not needed by the workers suite (studio, email testing,
# storage, realtime, edge runtime, analytics) is disabled so the stack
# boots fewer containers.
#
# Two halves make the stack boot, both load-bearing (issue #729, each
# verified on the pinned CLI):
#  * the suite PINs the CLI version (`SUPABASE_CLI_VERSION` in
#    crates/codegraph/tests/workers_live_gate.rs); a node-free lockstep pin
#    holds the workflow's prefetch LITERAL to it, so the runner can never
#    resolve npm `latest` into a different CLI than this file was written
#    for;
#  * this file speaks that version's KEY SPELLING. The rename below is
#    REQUIRED, not cosmetic: `supabase@3.2.0` REJECTS the legacy key
#    ("inbucket in supabase/config.toml is no longer supported. Use
#    local_smtp instead."), so `start` dies at config load without it —
#    while `supabase@2.105.0` still accepted `[inbucket]`. Do not revert.
#
# Limits of the lockstep pin, stated so nobody over-trusts it: it holds the
# prefetch literal and THIS section's key spelling + body (`[local_smtp]`,
# `enabled = false`, the 54343 port). It cannot know about a FUTURE CLI
# renaming some OTHER key — that surfaces as a config rejection in the
# nightly lane, not as a PR-CI failure.
project_id = "workers-gate"

[api]
enabled = true
port = 54341

[db]
port = 54340
shadow_port = 54349
major_version = 17

[db.pooler]
enabled = false
port = 54348

# The workers suite applies the generated migrations itself (psql per
# file, into the [database.api] target) — never `supabase db reset` —
# so the CLI's own migration/seed passes stay off.
[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false
port = 54342

[local_smtp]
enabled = false
port = 54343

[storage]
enabled = false

# GoTrue stays up: the harness health probe is Kong's /auth/v1/health.
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

[edge_runtime]
enabled = false

[analytics]
enabled = false
port = 54347
