# Issue #824 repro fixture: one recruiting domain, mox-first (no entities
# key — entity vs value object is author-declarative).
[defaults]
operations = ["create", "read", "update", "delete", "list"]
api_version = "v1"

[domains.recruiting]
label = "Recruiting"
schema_dir = "recruiting"
postgres_schema = "recruiting"

# Shapes 3 + 4 (issue #827): parent-scoped machine-bearing members.
[domains.recruiting.entity_config.InterviewType]
role = "child"
parent = "PositionOpeningType"
parent_ref = "position_opening_id"

[domains.recruiting.entity_config.InterviewNoteType]
role = "child"
parent = "PositionOpeningType"
parent_ref = "position_opening_id"
