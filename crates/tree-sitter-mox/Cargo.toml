[package]
name = "tree-sitter-mox"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
description = "Generated parser for the rexlang .mox modeling language (tree-sitter grammar)"
build = "build.rs"

# Generated from codegraph-vscode/grammar-mox (the grammar source of truth)
# and referenced by the codegraph crate as a path dependency, mirroring
# crates/tree-sitter-ifml.

[lib]
path = "src/lib.rs"
crate-type = ["staticlib", "lib"]

[dependencies]
tree-sitter = { workspace = true }
tree-sitter-language = { workspace = true }

[build-dependencies]
cc = "1"
